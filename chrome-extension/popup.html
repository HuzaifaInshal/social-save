<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Save Bookmarker</title>
  <style>
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #f5f6f6;
      --surface-hover: #eeeff0;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);
      --text: #000000;
      --text-muted: #6b6b6b;
      --accent: #5e6ad2;
      --accent-hover: #4a56c4;
      --accent-glow: rgba(94, 106, 210, 0.1);
      --success: #27a644;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --radius: 8px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #010102;
      --surface: #0f1011;
      --surface-hover: #141516;
      --border: #23252a;
      --border-strong: #34343a;
      --text: #f7f8f8;
      --text-muted: #8a8f98;
      --accent: #5e6ad2;
      --accent-hover: #828fff;
      --accent-glow: rgba(94, 106, 210, 0.22);
      --success: #27a644;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-width: 320px;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      min-height: 380px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #4d5cff, #9b5eea);
      box-shadow: 0 4px 12px rgba(117, 84, 237, 0.25);
      display: grid;
      place-items: center;
      color: white;
      flex-shrink: 0;
    }

    .connection-status {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    /* States */
    .state {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .state.active {
      display: flex;
    }

    /* Loading State */
    .loading-state {
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      text-align: center;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Disconnected State */
    .disconnected-state {
      text-align: center;
      padding: 1.5rem 0.5rem;
      align-items: center;
    }

    .warning-icon {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .description {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.45;
    }

    /* Form Elements */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-control {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .input-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-control--area {
      resize: vertical;
      min-height: 90px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 0.65rem 0.9rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      word-break: break-all;
      line-height: 1.4;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(39, 166, 68, 0.08);
      border: 1px solid rgba(39, 166, 68, 0.2);
      color: var(--success);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      padding: 0.65rem 1.1rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn--primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn--primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn--danger {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.2);
    }

    .btn--danger:hover {
      background: rgba(248, 113, 113, 0.18);
      border-color: rgba(248, 113, 113, 0.3);
    }

    .btn--secondary {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn--secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.15rem;
      transition: transform 0.3s ease, color 0.15s;
      outline: none;
      display: flex;
      align-items: center;
    }

    .settings-btn:hover {
      color: var(--text);
      transform: rotate(45deg);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width: 13px; height: 13px; display: block;"><path d="M5 3.5A1.5 1.5 0 0 1 6.5 2h7A1.5 1.5 0 0 1 15 3.5v13.1a.7.7 0 0 1-1.08.59L10 14.68l-3.92 2.51A.7.7 0 0 1 5 16.6V3.5Z" /></svg>
        </span>
        Social Save
      </div>
      <div class="connection-status">
        <span id="connection-dot" class="status-dot"></span>
        <span id="connection-text">Connecting</span>
      </div>
    </div>

    <!-- 1. Loading State -->
    <div id="state-loading" class="state active loading-state">
      <div class="spinner"></div>
      <p id="loading-message">Connecting to Social Save dashboard…</p>
    </div>

    <!-- 2. Disconnected State -->
    <div id="state-disconnected" class="state disconnected-state">
      <div class="error-icon">🔑</div>
      <div class="disconnected-title">Account Not Connected</div>
      <p class="disconnected-desc">Please link your Social Save account to fetch collections and start bookmarking posts.</p>
      <button id="btn-open-dashboard" class="btn btn--primary">Connect Account</button>
    </div>

    <!-- 3. Form State (Unsaved Post) -->
    <div id="state-form" class="state">
      <div class="form-group">
        <span class="label">Platform Url</span>
        <div class="info-card" id="txt-page-url">Loading page URL...</div>
      </div>

      <div class="form-group">
        <label class="label" for="inp-title">Bookmark Title</label>
        <input type="text" id="inp-title" class="input-control" placeholder="Enter post title...">
      </div>

      <div class="form-group">
        <label class="label" for="inp-description">Description (Optional)</label>
        <input type="text" id="inp-description" class="input-control" placeholder="Add notes or tags...">
      </div>

      <div class="form-group">
        <label class="label" for="sel-collection">Save to Collection</label>
        <select id="sel-collection" class="input-control">
          <option value="">Root level (no collection)</option>
        </select>
      </div>

      <button id="btn-bookmark" class="btn btn--primary">💾 Save Bookmark</button>
    </div>

    <!-- 4. Bookmarked State (Saved Post) -->
    <div id="state-bookmarked" class="state">
      <div class="status-badge">
        <span class="status-badge-icon">✓</span>
        <span id="lbl-saved-message">Already Saved</span>
      </div>

      <div class="form-group">
        <span class="label">Bookmarked Link</span>
        <div class="info-card" id="txt-saved-url">Loading page URL...</div>
      </div>

      <button id="btn-unbookmark" class="btn btn--danger">🗑 Remove Bookmark</button>
    </div>

    <!-- 5. Settings State -->
    <div id="state-settings" class="state">
      <h2 style="font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center;">Extension Settings</h2>
      
      <div class="form-group">
        <label class="label" for="sel-view-style">Extension View Style</label>
        <select id="sel-view-style" class="input-control">
          <option value="sidepanel">Side Panel (Default)</option>
          <option value="popup">Popup</option>
        </select>
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <button id="btn-logout" class="btn btn--danger">🚪 Log Out</button>
      </div>

      <button id="btn-back-settings" class="btn btn--secondary" style="margin-top: 0.5rem;">Back</button>
    </div>

    <!-- Footer / Settings Button & Theme Toggle -->
    <div class="footer" style="margin-top: auto; padding-top: 0.75rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button id="btn-settings-trigger" class="settings-btn" title="Settings">⚙️</button>
        <button id="btn-theme-toggle" class="settings-btn" title="Toggle Theme" style="font-size: 1.05rem;">🌙</button>
      </div>
      <span style="font-size: 0.7rem; color: var(--text-muted);">v1.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
