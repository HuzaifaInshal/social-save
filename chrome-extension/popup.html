<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Save Bookmarker</title>
  <style>
    :root {
      --bg: #090e1a;
      --surface: #101827;
      --surface-hover: #1e293b;
      --border: rgba(148, 163, 184, 0.12);
      --accent: linear-gradient(135deg, #818cf8 0%, #a78bfa 100%);
      --accent-hover: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-width: 320px;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .container {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 380px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 0.85rem;
      -webkit-text-fill-color: white;
    }

    .connection-status {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    /* States */
    .state {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .state.active {
      display: flex;
    }

    /* Loading State */
    .loading-state {
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      text-align: center;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(167, 139, 250, 0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Disconnected State */
    .disconnected-state {
      align-items: center;
      text-align: center;
      padding: 1.5rem 0.5rem;
      gap: 1.25rem;
    }

    .error-icon {
      font-size: 2.5rem;
    }

    .disconnected-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .disconnected-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 280px;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-control {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.15s;
    }

    .input-control:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
    }

    .input-control::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    /* Badges */
    .info-card {
      background: rgba(16, 24, 39, 0.6);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: break-all;
      line-height: 1.3;
    }

    .info-card strong {
      color: var(--text);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--success);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .status-badge-icon {
      font-size: 1.1rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.72rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn--primary {
      background: var(--accent);
    }

    .btn--primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn--danger {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
    }

    .btn--danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.35);
      transform: translateY(-1px);
    }

    .btn--secondary {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 100%;
      padding: 0.72rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn--secondary:hover {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text);
      transform: translateY(-1px);
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.15rem;
      transition: transform 0.3s ease, color 0.15s;
      outline: none;
      display: flex;
      align-items: center;
    }

    .settings-btn:hover {
      color: var(--text);
      transform: rotate(45deg);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="brand-icon">S</span>
        Social Save
      </div>
      <div class="connection-status">
        <span id="connection-dot" class="status-dot"></span>
        <span id="connection-text">Connecting</span>
      </div>
    </div>

    <!-- 1. Loading State -->
    <div id="state-loading" class="state active loading-state">
      <div class="spinner"></div>
      <p id="loading-message">Connecting to Social Save dashboard…</p>
    </div>

    <!-- 2. Disconnected State -->
    <div id="state-disconnected" class="state disconnected-state">
      <div class="error-icon">🔑</div>
      <div class="disconnected-title">Account Not Connected</div>
      <p class="disconnected-desc">Please link your Social Save account to fetch collections and start bookmarking posts.</p>
      <button id="btn-open-dashboard" class="btn btn--primary">Connect Account</button>
    </div>

    <!-- 3. Form State (Unsaved Post) -->
    <div id="state-form" class="state">
      <div class="form-group">
        <span class="label">Platform Url</span>
        <div class="info-card" id="txt-page-url">Loading page URL...</div>
      </div>

      <div class="form-group">
        <label class="label" for="inp-title">Bookmark Title</label>
        <input type="text" id="inp-title" class="input-control" placeholder="Enter post title...">
      </div>

      <div class="form-group">
        <label class="label" for="inp-description">Description (Optional)</label>
        <input type="text" id="inp-description" class="input-control" placeholder="Add notes or tags...">
      </div>

      <div class="form-group">
        <label class="label" for="sel-collection">Save to Collection</label>
        <select id="sel-collection" class="input-control">
          <option value="">Root level (no collection)</option>
        </select>
      </div>

      <button id="btn-bookmark" class="btn btn--primary">💾 Save Bookmark</button>
    </div>

    <!-- 4. Bookmarked State (Saved Post) -->
    <div id="state-bookmarked" class="state">
      <div class="status-badge">
        <span class="status-badge-icon">✓</span>
        <span id="lbl-saved-message">Already Saved</span>
      </div>

      <div class="form-group">
        <span class="label">Bookmarked Link</span>
        <div class="info-card" id="txt-saved-url">Loading page URL...</div>
      </div>

      <button id="btn-unbookmark" class="btn btn--danger">🗑 Remove Bookmark</button>
    </div>

    <!-- 5. Settings State -->
    <div id="state-settings" class="state">
      <h2 style="font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center;">Extension Settings</h2>
      
      <div class="form-group">
        <label class="label" for="sel-view-style">Extension View Style</label>
        <select id="sel-view-style" class="input-control">
          <option value="sidepanel">Side Panel (Default)</option>
          <option value="popup">Popup</option>
        </select>
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <button id="btn-logout" class="btn btn--danger">🚪 Log Out</button>
      </div>

      <button id="btn-back-settings" class="btn btn--secondary" style="margin-top: 0.5rem;">Back</button>
    </div>

    <!-- Footer / Settings Button -->
    <div class="footer" style="margin-top: auto; padding-top: 0.75rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
      <button id="btn-settings-trigger" class="settings-btn" title="Settings">⚙️</button>
      <span style="font-size: 0.7rem; color: var(--text-muted);">v1.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
